<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Artem Ageev Production</title>
  <meta name="description" content="Продакшен Артема Агеева" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <a href="#hero" class="to-top" aria-label="Наверх">↑</a>

  <div class="page">
    <header class="header">
      <div class="shell">
        <nav class="nav" id="nav"></nav>
      </div>
    </header>

    <main>
      <section id="hero" class="hero">
        <div class="shell hero-grid">
          <div class="hero-left">
            <h1 class="hero-title" id="heroTitle"></h1>
            <div class="hero-text" id="heroText"></div>
            <div class="hero-actions">
              <a class="btn-primary" id="heroButton" href="portfolio.html"></a>
              <div class="badge badge-hero" id="heroBadge"></div>
            </div>
          </div>

          <div class="hero-right">
            <div class="star star-1"></div>
            <div class="star star-2"></div>

            <div class="hero-media">
              <div class="hero-video-blend">
                <video
                  class="auto-video"
                  id="heroVideo"
                  autoplay
                  muted
                  loop
                  playsinline
                  preload="auto"
                ></video>
              </div>

              <div class="badge badge-corner" id="heroMediaBadge"></div>

              <div class="hero-media-content">
                <h2 id="heroMediaTitle"></h2>
                <p id="heroMediaText"></p>
              </div>
            </div>
          </div>
        </div>
      </section>

      <section id="about" class="about">
        <div class="shell">
          <div class="about-wrap">
            <video
              class="auto-video"
              id="aboutVideo"
              autoplay
              muted
              loop
              playsinline
              preload="auto"
            ></video>

            <div class="about-overlay"></div>

            <div class="about-content">
              <h2 class="section-title" id="aboutTitle"></h2>
              <div class="section-copy" id="aboutText"></div>
            </div>
          </div>
        </div>
      </section>

      <section id="services" class="services">
        <div class="shell">
          <h2 class="section-title" id="servicesTitle"></h2>
          <div class="services-grid" id="servicesGrid"></div>
        </div>
      </section>

      <section id="clients" class="clients">
        <div class="shell clients-head">
          <div class="star star-3"></div>
          <div class="star star-4"></div>
          <h2 class="section-title" id="clientsTitle"></h2>
          <p class="section-lead" id="clientsLead"></p>
        </div>

        <div class="clients-marquee-wrap">
          <div class="clients-marquee" id="clientsRow1"></div>
          <div class="clients-marquee reverse" id="clientsRow2"></div>
        </div>

        <div class="shell">
          <div class="cta">
            <div class="cta-inner">
              <div>
                <h3 id="ctaTitle"></h3>
                <p id="ctaText"></p>
              </div>
              <a class="btn-primary btn-cta" id="ctaButton" href="portfolio.html"></a>
            </div>
          </div>
        </div>
      </section>

      <section id="contacts" class="contacts">
        <div class="shell">
          <div class="contacts-wrap">
            <h2 class="section-title center" id="contactsTitle"></h2>
            <p class="section-lead" id="contactsLead"></p>
            <div class="contacts-grid" id="contactsGrid"></div>
            <div class="footer-copy" id="footerCopy"></div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script src="js/content.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
