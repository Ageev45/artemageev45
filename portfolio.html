<style>
body{background:#05050a;color:#fff;font-family:Arial;padding:60px}
.grid{
display:grid;
grid-template-columns:repeat(2,1fr);

}

iframe{
width:100%;
height:300px;
border-radius:20px;
border:none;
}

h1{margin-bottom:40px}

@media(max-width:900px){
.grid{grid-template-columns:1fr}
}
</style>
</head>

<body>
